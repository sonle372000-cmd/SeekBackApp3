buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.4'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
    }
}

// KHONG khai bao "allprojects { repositories {...} }" o day nua,
// vi settings.gradle da dung dependencyResolutionManagement de
// quan ly repository tap trung (FAIL_ON_PROJECT_REPOS). Neu khai
// bao lai o day se bi loi "prefer settings repositories over project
// repositories".

task clean(type: Delete) {
    delete rootProject.buildDir
}
