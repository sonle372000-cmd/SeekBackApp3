name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # May ao ubuntu-latest da co san Android SDK, nhung sdkmanager
      # nam trong thu muc co ten phien ban, vd:
      # cmdline-tools/16.0/bin/sdkmanager (sau 3 cap tinh tu cmdline-tools)
      # nen phai tim voi maxdepth du sau, dong thoi kiem tra ca hai bien
      # moi truong ANDROID_HOME va ANDROID_SDK_ROOT phong khi bien nao rong.
      - name: Locate sdkmanager
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Using SDK dir: $SDK_DIR"
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -maxdepth 4 -type f -name sdkmanager | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "Khong tim thay sdkmanager, liet ke thu muc de kiem tra:"
            find "$SDK_DIR/cmdline-tools" -maxdepth 4
            exit 1
          fi
          echo "Found sdkmanager at: $SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install platform & build-tools
        run: |
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      # Repo nay khong co san file gradlew (gradle wrapper),
      # nen dung action nay de tu dong cai dat Gradle va chay lenh "gradle"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SeekBack-debug-apk
          path: app/build/outputs/apk/debug/*.apk
